<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
</head>
<body>

<script>
(function () {

    const IOS_URL =
        "https://apps.apple.com/us/app/avis-budget-egypt/id6747757208";

    const ANDROID_URL =
        "https://play.google.com/store/apps/details?id=com.ezzelarab.ABG";

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    if (/Android/i.test(ua)) {

        window.location.replace(ANDROID_URL);

        setTimeout(function () {
            window.location.href = ANDROID_URL;
        }, 500);

    } else if (/iPhone|iPad|iPod/i.test(ua)) {

        window.location.replace(IOS_URL);

        setTimeout(function () {
            window.location.href = IOS_URL;
        }, 500);

        setTimeout(function () {
            document.location = IOS_URL;
        }, 1500);

    } else {

        window.location.href = IOS_URL;

    }

})();
</script>

</body>
</html>
