<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
</head>
<body>

<script>
const APP_STORE_URL =
    "https://apps.apple.com/us/app/avis-budget-egypt/id6747757208";

const PLAY_STORE_URL =
    "https://play.google.com/store/apps/details?id=com.ezzelarab.ABG";

const ua = navigator.userAgent;

if (/Android/i.test(ua)) {
    location.replace(PLAY_STORE_URL);
}
else if (/iPhone|iPad|iPod/i.test(ua)) {
    location.replace(APP_STORE_URL);

    // Fallback attempts
    setTimeout(() => {
        location.href = APP_STORE_URL;
    }, 500);

    setTimeout(() => {
        window.location = APP_STORE_URL;
    }, 1500);
}
</script>

</body>
</html>
