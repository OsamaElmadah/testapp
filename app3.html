<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
</head>
<body>
  <p>Redirecting to the store...</p>
<button onclick="window.open('https://apps.apple.com/us/app/avis-budget-egypt/id6747757208', '_blank')">
    click here to open the store
</button>
<script>
const ua = navigator.userAgent;

if (/Android/i.test(ua)) {
    location.replace(
        "https://play.google.com/store/apps/details?id=com.ezzelarab.ABG"
    );
}
else if (/iPhone|iPad|iPod/i.test(ua)) {
    location.replace(
        "https://apps.apple.com/us/app/avis-budget-egypt/id6747757208"
    );
}
</script>

</body>
</html>
